name: Auth notification Platform ownership
on:
  push:
    branches: [refactor]
    paths: [.github/workflows/auth-notification-owner-cutover.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare sibling commerce
        run: git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pgsql, gd
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          touch database/database.sqlite
          composer install --no-interaction --no-progress --prefer-dist
      - name: Capture command and route baselines
        run: |
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.before
          php artisan route:list --json > /tmp/routes.before
      - name: Directly move the three authentication notifications
        run: python3 scripts/auth-notification-owner-cutover.py
      - name: Verify autoload, mail delivery queue and public behavior
        run: |
          composer dump-autoload --no-scripts --optimize
          php artisan optimize:clear
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.after
          php artisan route:list --json > /tmp/routes.after
          diff -u /tmp/commands.before /tmp/commands.after
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/routes.before'))==json.load(open('/tmp/routes.after'))
          for name in ('ResetPasswordNotification','VerifyEmailNotification','WelcomeNotification'):
              path='app/Platform/Auth/Notifications/'+name+'.php'
              value=open(path).read()
              assert "afterCommit()" in value
              assert "'notifications-mail'" in value
          print('Auth mail delivery contracts and HTTP transport preserved')
          PY
          php artisan tinker --execute="if (!(new \\App\\Platform\\Auth\\Notifications\\VerifyEmailNotification instanceof \\Illuminate\\Contracts\\Queue\\ShouldQueue)) { throw new \\RuntimeException('Verification notification no longer queued'); }"
          php artisan tinker --execute="if (!(new \\App\\Platform\\Auth\\Notifications\\ResetPasswordNotification('token') instanceof \\Illuminate\\Contracts\\Queue\\ShouldQueue)) { throw new \\RuntimeException('Password notification no longer queued'); }"
      - name: Architecture, Pint, PHPStan and Rector
        run: |
          git add -A
          vendor/bin/pint --dirty
          git add -A
          git diff --cached --check
          composer architecture:test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          vendor/bin/rector process --dry-run
      - name: Auth notification regression tests
        run: |
          vendor/bin/pest --compact tests/Feature/Auth/AuthenticationTest.php tests/Feature/Auth/RegistrationPageTest.php tests/Feature/SignupAttributionAuthTest.php
      - name: Lint and commit without legacy files
        shell: bash
        run: |
          set -euo pipefail
          while read -r f; do php -l "$f" >/dev/null; done < <(git diff --cached --name-only --diff-filter=ACMR | grep -E '^app/.*\.php$')
          test ! -d app/Notifications/Auth || test -z "$(find app/Notifications/Auth -type f)"
          rm -f scripts/auth-notification-owner-cutover.py .github/workflows/auth-notification-owner-cutover.yml
          git add -A
          git diff --cached --check
          git config user.name "ilmu360-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: consolidate authentication notifications under Platform Auth"
          git push origin HEAD:refactor
