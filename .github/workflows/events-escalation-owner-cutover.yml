name: One-time final root job elimination
on:
  push:
    branches: [refactor]
    paths: ['.github/workflows/events-escalation-owner-cutover.yml']
permissions:
  contents: write
concurrency:
  group: final-root-job-cutover-refactor
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Obtain sibling Commerce sources
        run: |
          git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
          test -f ../commerce/packages/commerce-support/composer.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pgsql, gd
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          touch database/database.sqlite
          composer install --no-interaction --no-progress --prefer-dist
      - name: Capture transport and scheduling baselines
        run: |
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.before
          php artisan route:list --json > /tmp/routes.before.json
          php artisan schedule:list --no-ansi > /tmp/schedules.before
          test "$(grep -c 'escalate-pending-events' /tmp/schedules.before)" -eq 1
      - name: Directly move final root job and named writer to Events
        run: python3 scripts/events-escalation-owner-cutover.py
      - name: Verify DI, schedule uniqueness and public transport stability
        run: |
          composer dump-autoload --no-scripts --optimize
          php artisan optimize:clear
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.after
          php artisan route:list --json > /tmp/routes.after.json
          php artisan schedule:list --no-ansi > /tmp/schedules.after
          diff -u /tmp/commands.before /tmp/commands.after
          test "$(grep -c 'escalate-pending-events' /tmp/schedules.after)" -eq 1
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/routes.before.json'))==json.load(open('/tmp/routes.after.json'))
          print("HTTP route registration stable; SLA schedule exists exactly once")
          PY
          php artisan tinker --execute="if (!(app(\\App\\Shared\\Events\\EventEscalationTransport::class) instanceof \\App\\Platform\\Notifications\\EloquentEventEscalationTransport)) { throw new \\RuntimeException('Escalation transport binding missing'); }"
      - name: Verify architecture, formatting and types
        run: |
          git add -A
          vendor/bin/pint --dirty
          git add -A
          git diff --cached --check
          composer architecture:test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Verify escalation and moderation regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -name '*Test.php' | grep -Ei 'Escalat|Moderation' | LC_ALL=C sort | head -n 8 || true)
          echo "Running ${#tests[@]} related regression files"
          if (( ${#tests[@]} > 0 )); then
            vendor/bin/pest --compact "${tests[@]}"
          fi
      - name: Check PHP syntax and final root Jobs emptiness
        run: |
          php -l app/Features/Events/EntryPoints/Jobs/EscalatePendingEvents.php
          php -l app/Features/Events/Actions/Escalations/RecordPendingEventEscalationAction.php
          php -l app/Shared/Events/EventEscalationTransport.php
          php -l app/Platform/Notifications/EloquentEventEscalationTransport.php
          test ! -f app/Jobs/EscalatePendingEvents.php
          test ! -d app/Jobs || test -z "$(find app/Jobs -type f)"
      - name: Remove one-time code and commit no-legacy cutover
        run: |
          rm -f scripts/events-escalation-owner-cutover.py .github/workflows/events-escalation-owner-cutover.yml
          git add -A
          git diff --cached --check
          git config user.name "ilmu360-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: eliminate root Jobs via Events-owned escalation writer and transport"
          git push origin HEAD:refactor

# Restore invariant Auth contract collection type in escalation adapter.

# Explicit upcast of trusted Eloquent role collection at transport seam.

# Tests now invoke the queued job through the Laravel container.
