name: Temporary refactor source export
on:
  push:
    branches: [refactor]
    paths:
      - '.github/workflows/refactor-source-export.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked checkout
        run: git archive --format=tar.gz --output=ilmu360-refactor-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ilmu360-refactor-source
          path: ilmu360-refactor-source.tar.gz
          retention-days: 1
