name: Temporary Directory Refactor Verification
on:
  push:
    branches: [refactor]
    paths:
      - '.github/workflows/verify-directory-refactor.yml'
      - 'app/**'
      - 'tools/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    steps:
      - name: Check out refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0
      - name: Configure PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pdo_sqlite, sqlite3, pgsql
          coverage: none
          tools: composer:v2
      - name: Obtain sibling commerce package sources
        run: |
          git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
          test -f ../commerce/packages/commerce-support/composer.json
      - name: Install composer dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          composer install --no-interaction --no-progress --prefer-dist
      - name: Confirm feature architecture
        run: |
          php tools/architecture-check.php
          composer architecture:types
      - name: Compare existing route identities
        run: |
          php artisan route:list --json --no-interaction > /tmp/after.json
          git worktree add --detach ../ilmu360-before 39c51c0f205fb49503496c694ef54c0b9fbd51ac
          ln -s "$GITHUB_WORKSPACE/vendor" ../ilmu360-before/vendor
          cd ../ilmu360-before
          php artisan route:list --json --no-interaction > /tmp/before.json
          python3 - <<'PY'
          import json
          from collections import Counter
          def routes(filename):
              return Counter((r.get('domain'),r.get('method'),r.get('uri'),r.get('name'),tuple(r.get('middleware') or [])) for r in json.load(open(filename)))
          before, after = routes('/tmp/before.json'), routes('/tmp/after.json')
          print('Before',sum(before.values()),'After',sum(after.values()))
          assert before == after, f'Route drift: added={after-before}, removed={before-after}'
          print('Route identity/middleware parity: PASS')
          PY
      - name: Validate code format
        run: vendor/bin/pint --test
      - name: PHPStan analysis
        run: php -d max_memory_limit=1G vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Run affected Pest suite
        run: |
          set -o pipefail
          vendor/bin/pest --parallel --compact \
            tests/Feature/FeatureOwnershipSeamsTest.php \
            tests/Feature/InstitutionHardeningTest.php \
            tests/Feature/InstitutionAdminFacilitiesTest.php \
            tests/Feature/SpaceModelRemediationTest.php \
            tests/Feature/VenueLocationCascadeTest.php \
            tests/Feature/SaveDonationChannelActionTest.php \
            tests/Feature/InstitutionContributionLocationPickerTest.php \
            tests/Feature/Events/EventMediaSeamTest.php \
            tests/Feature/ContributionWorkflowServiceTest.php \
            tests/Feature/ReferenceFamilyTest.php \
            tests/Feature/PersonSearchCacheTest.php \
            tests/Feature/ResourceSearchDispatcherTest.php \
            tests/Feature/SlugRedirectFeatureTest.php \
            tests/Feature/LifecycleHardeningTest.php \
            tests/Feature/AccountSettingsPageTest.php \
            tests/Feature/MembershipApplicationPagesTest.php \
            tests/Feature/MembershipApplicationActionsTest.php \
            tests/Feature/ReportActionsTest.php \
            tests/Feature/ReportAdminResourceTest.php \
            tests/Feature/Mcp/AdminServerTest.php \
            tests/Feature/Api/Admin/AdminApiTest.php \
            tests/Feature/Api/Frontend/FrontendApiParityTest.php \
            tests/Feature/HomePageTest.php \
            tests/Feature/PublicListingCacheInvalidationTest.php \
            tests/Unit/PublicDirectoryCacheVersionsTest.php \
            tests/Unit/Platform/ArchitectureBoundaryTest.php
