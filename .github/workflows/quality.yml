name: Quality

on:
  push:
    branches: [main, refactor, develop]
  pull_request:
    branches: [main, refactor, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.filter.outputs.php }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            php:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - 'pint.json'
              - 'rector.php'
              - 'phpstan.neon'
            tests:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - 'phpunit.xml'
              - 'tests/**'

  rector:
    name: Rector (check)
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, dom, fileinfo, intl, pcntl, pdo_sqlite, sqlite3, pgsql
          ini-values: memory_limit=-1
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-rector-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Prepare application environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Verify Composer private repository auth
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          if [ -z "$COMPOSER_AUTH" ]; then
            echo "::error::Missing COMPOSER_AUTH GitHub secret. Set it to a Composer auth JSON payload that includes http-basic credentials for packages.filamentphp.com."
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys

          try:
              auth = json.loads(os.environ['COMPOSER_AUTH'])
          except json.JSONDecodeError as error:
              print(f"::error::COMPOSER_AUTH is not valid JSON: {error}")
              sys.exit(1)

          credentials = auth.get('http-basic', {}).get('packages.filamentphp.com', {})

          if not credentials.get('username') or not credentials.get('password'):
              print('::error::COMPOSER_AUTH must include http-basic credentials for packages.filamentphp.com.')
              sys.exit(1)
          PY

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate --ansi --force

      - name: Clear config cache
        run: php artisan config:clear --ansi

      - name: Check Rector (dry-run)
        run: vendor/bin/rector process --dry-run --ansi

  pint:
    name: Pint (check)
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, dom, fileinfo, intl, pcntl, pdo_sqlite, sqlite3, pgsql
          ini-values: memory_limit=-1
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-pint-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-pint-

      - name: Prepare application environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Verify Composer private repository auth
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          if [ -z "$COMPOSER_AUTH" ]; then
            echo "::error::Missing COMPOSER_AUTH GitHub secret."
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys

          try:
              auth = json.loads(os.environ['COMPOSER_AUTH'])
          except json.JSONDecodeError as error:
              print(f"::error::COMPOSER_AUTH is not valid JSON: {error}")
              sys.exit(1)

          credentials = auth.get('http-basic', {}).get('packages.filamentphp.com', {})

          if not credentials.get('username') or not credentials.get('password'):
              print('::error::COMPOSER_AUTH must include http-basic credentials for packages.filamentphp.com.')
              sys.exit(1)
          PY

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Check Pint (test)
        run: vendor/bin/pint --test

  phpstan:
    name: PHPStan
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, dom, fileinfo, intl, pcntl, pdo_sqlite, sqlite3, pgsql
          ini-values: memory_limit=-1
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-phpstan-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Prepare application environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Verify Composer private repository auth
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          if [ -z "$COMPOSER_AUTH" ]; then
            echo "::error::Missing COMPOSER_AUTH GitHub secret."
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys

          try:
              auth = json.loads(os.environ['COMPOSER_AUTH'])
          except json.JSONDecodeError as error:
              print(f"::error::COMPOSER_AUTH is not valid JSON: {error}")
              sys.exit(1)

          credentials = auth.get('http-basic', {}).get('packages.filamentphp.com', {})

          if not credentials.get('username') or not credentials.get('password'):
              print('::error::COMPOSER_AUTH must include http-basic credentials for packages.filamentphp.com.')
              sys.exit(1)
          PY

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate --ansi --force

      - name: Clear config cache
        run: php artisan config:clear --ansi

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --ansi --no-progress

  tests:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: Pest (PHP 8.4) - Shard ${{ matrix.shard }}/4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, dom, fileinfo, intl, pcntl, pdo_sqlite, sqlite3, pgsql
          ini-values: memory_limit=-1
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare application environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Verify Composer private repository auth
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          if [ -z "$COMPOSER_AUTH" ]; then
            echo "::error::Missing COMPOSER_AUTH GitHub secret."
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys

          try:
              auth = json.loads(os.environ['COMPOSER_AUTH'])
          except json.JSONDecodeError as error:
              print(f"::error::COMPOSER_AUTH is not valid JSON: {error}")
              sys.exit(1)

          credentials = auth.get('http-basic', {}).get('packages.filamentphp.com', {})

          if not credentials.get('username') or not credentials.get('password'):
              print('::error::COMPOSER_AUTH must include http-basic credentials for packages.filamentphp.com.')
              sys.exit(1)
          PY

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate --ansi --force

      - name: Clear config cache
        run: php artisan config:clear --ansi

      - name: Run tests (Pest)
        run: composer test -- --parallel --shard=${{ matrix.shard }}/4 --compact

  quality:
    name: Quality
    needs: [changes, rector, pint, phpstan, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize job results
        run: |
          echo "rector:  ${{ needs.rector.result }}"
          echo "pint:    ${{ needs.pint.result }}"
          echo "phpstan: ${{ needs.phpstan.result }}"
          echo "tests:   ${{ needs.tests.result }}"

      - name: Enforce required checks
        run: |
          results=("${{ needs.rector.result }}" "${{ needs.pint.result }}" "${{ needs.phpstan.result }}" "${{ needs.tests.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              exit 1
            fi
          done
