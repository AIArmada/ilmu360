name: Root Actions Migration Audit

on:
  push:
    branches: [refactor]

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory root Actions references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print root action imports and call sites
        shell: bash
        run: |
          echo '=== Root action namespace references ==='
          grep -RnF --include='*.php' 'App\Actions\' app tests config bootstrap routes tools || true
          echo '=== Short class-name references to Institution Maps actions ==='
          grep -REn --include='*.php' 'InferInstitutionTypeAction|MergeInstitutionMapsSelectionIntoFormAction|ResolveInstitutionMapsPlaceSelectionAction' app tests config bootstrap routes || true
          echo '=== Current root Action files ==='
          find app/Actions -type f -name '*.php' | sort
          echo '=== Assert no retired finance policy / referral job imports ==='
          if grep -RnF --include='*.php' 'App\\Support\\ShareTracking\\ShareTrackingFinance' app tests config bootstrap routes tools; then
            echo 'Retired ShareTrackingFinance namespace is still referenced.'
            exit 1
          fi
          if grep -RnF --include='*.php' 'App\\Jobs\\Referrals\\ReverseReferralRewardsForShareOutcomeJob' app tests config bootstrap routes tools; then
            echo 'Retired referral reversal job namespace is still referenced.'
            exit 1
          fi
      - name: Reject imports of removed root actions (including Volt/Blade)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          roots = [Path(p) for p in ('app', 'resources', 'tests', 'config', 'bootstrap', 'routes', 'tools', 'database')]
          imports = re.compile(r'^\s*use\s+(App\\Actions\\[A-Za-z_][A-Za-z0-9_\\]*)(?:\s+as\s+\w+)?\s*;')
          fqcn = re.compile(r'(App\\Actions\\[A-Za-z_][A-Za-z0-9_\\]*)::class')
          missing = []

          for root in roots:
              if not root.exists():
                  continue
              for file in root.rglob('*.php'):
                  for line_number, line in enumerate(file.read_text(encoding='utf-8', errors='replace').splitlines(), 1):
                      stripped = line.lstrip()
                      if stripped.startswith(('*', '//', '#', '/*')):
                          continue
                      matches = [*imports.findall(line), *fqcn.findall(line)]
                      for name in set(matches):
                          expected = Path('app') / Path(name.removeprefix('App\\').replace('\\', '/')).with_suffix('.php')
                          if not expected.is_file():
                              missing.append(f'{file}:{line_number}: {name} (missing {expected})')

          if missing:
              print('Dangling root Action class references:')
              print('\n'.join(sorted(missing)))
              sys.exit(1)

          print('No imports or ::class references to deleted root actions.')
          PY
