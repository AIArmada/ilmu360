name: Root Actions Migration Audit

on:
  push:
    branches: [refactor]

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory root Actions references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print root action imports and call sites
        shell: bash
        run: |
          echo '=== Root action namespace references ==='
          grep -RnF --include='*.php' 'App\Actions\' app tests config bootstrap routes tools || true
          echo '=== Short class-name references to Institution Maps actions ==='
          grep -REn --include='*.php' 'InferInstitutionTypeAction|MergeInstitutionMapsSelectionIntoFormAction|ResolveInstitutionMapsPlaceSelectionAction' app tests config bootstrap routes || true
          echo '=== Current root Action files ==='
          find app/Actions -type f -name '*.php' | sort
