name: One-time root to feature cutover
on:
  push:
    branches: [refactor]
    paths: ['.github/workflows/root-feature-cutover.yml']
permissions:
  contents: write
concurrency:
  group: root-feature-cutover-refactor
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Obtain sibling Commerce sources
        run: |
          git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
          test -f ../commerce/packages/commerce-support/composer.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pgsql, gd
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          touch database/database.sqlite
          composer install --no-interaction --no-progress --prefer-dist
      - name: Capture existing command signatures
        run: php artisan list --raw | LC_ALL=C sort > /tmp/commands.before
      - name: Move ownership directly, without aliases
        run: python3 scripts/root-feature-cutover.py
      - name: Update optimized autoload map
        run: composer dump-autoload --no-scripts --optimize
      - name: Check command discovery and route registration
        run: |
          php artisan optimize:clear
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.after
          diff -u /tmp/commands.before /tmp/commands.after
          php artisan route:list --json > /tmp/routes.after.json
      - name: Run formatting and mechanical architecture checks
        run: |
          git add -A
          vendor/bin/pint --dirty
          git add -A
          git diff --cached --check
          composer architecture:test
      - name: Check changed PHP syntax
        run: |
          git diff --cached --name-only --diff-filter=ACMR | grep -E '^app/.*\.php$|^bootstrap/.*\.php$' | while read -r file; do
            php -l "$file" >/dev/null || exit 1
          done
      - name: Finish with no migration scaffolding left behind
        run: |
          rm -f scripts/root-feature-cutover.py .github/workflows/root-feature-cutover.yml .github/workflows/root-feature-audit.yml
          git add -A
          git diff --cached --check
          git config user.name "ilmu360-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: relocate feature commands and shared infrastructure to owners"
          git push origin HEAD:refactor
