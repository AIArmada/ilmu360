name: Console entrypoint ownership
on:
  push:
    branches: [refactor]
    paths: [.github/workflows/console-owner-cutover.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare commerce source
        run: git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pgsql, gd
          coverage: none
          tools: composer:v2
      - name: Install application dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          touch database/database.sqlite
          composer install --no-interaction --no-progress --prefer-dist
      - name: Capture public CLI and HTTP baselines
        run: |
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.before
          php artisan route:list --json > /tmp/routes.before
          php artisan help persons:reindex-search --no-ansi > /tmp/person-help.before
          php artisan help app:sync-public-submission-locks --no-ansi > /tmp/submission-help.before
          test "$(grep -c '^persons:reindex-search ' /tmp/commands.before)" -eq 1
          test "$(grep -c '^app:sync-public-submission-locks ' /tmp/commands.before)" -eq 1
      - name: Move commands to their explicit owners
        run: python3 scripts/console-owner-cutover.py
      - name: Verify public command parity and shared adapter
        run: |
          composer dump-autoload --no-scripts --optimize
          php artisan optimize:clear
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.after
          php artisan route:list --json > /tmp/routes.after
          php artisan help persons:reindex-search --no-ansi > /tmp/person-help.after
          php artisan help app:sync-public-submission-locks --no-ansi > /tmp/submission-help.after
          diff -u /tmp/commands.before /tmp/commands.after
          diff -u /tmp/person-help.before /tmp/person-help.after
          diff -u /tmp/submission-help.before /tmp/submission-help.after
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/routes.before')) == json.load(open('/tmp/routes.after'))
          print("Public routes unchanged")
          PY
          php artisan tinker --execute="if (!(app(\\App\\Shared\\Submission\\PublicSubmissionLockSweeper::class) instanceof \\App\\Support\\Submission\\PublicSubmissionLockService)) { throw new \\RuntimeException('Missing lock sweeper binding'); }"
          php artisan tinker --execute="if (!(app(\\App\\Features\\Persons\\Api\\PersonSearchMaintenance::class) instanceof \\App\\Support\\Search\\PersonSearchService)) { throw new \\RuntimeException('Missing person search maintenance binding'); }"
      - name: Architecture, formatting, types and Rector
        run: |
          git add -A
          vendor/bin/pint --dirty
          git add -A
          git diff --cached --check
          composer architecture:test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          vendor/bin/rector process --dry-run
      - name: Targeted person and submission tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -name '*Test.php' | grep -Ei 'PersonSearch|SubmissionLock|Person.*Index|Institution.*Access' | LC_ALL=C sort | head -n 8 || true)
          echo "Running ${#tests[@]} relevant test files"
          if (( ${#tests[@]} > 0 )); then vendor/bin/pest --compact "${tests[@]}"; fi
      - name: Lint and commit without leftovers
        shell: bash
        run: |
          set -euo pipefail
          while read -r f; do php -l "$f" >/dev/null; done < <(git diff --cached --name-only --diff-filter=ACMR | grep -E '^app/.*\.php$')
          test ! -f app/Console/Commands/ReindexPersonSearch.php
          test ! -f app/Console/Commands/SyncPublicSubmissionLocks.php
          rm -f scripts/console-owner-cutover.py .github/workflows/console-owner-cutover.yml
          git add -A
          git diff --cached --check
          git config user.name "ilmu360-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: rehome person search and public submission console entrypoints"
          git push origin HEAD:refactor
