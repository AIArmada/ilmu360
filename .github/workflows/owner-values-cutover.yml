name: One-time domain value ownership
on:
  push:
    branches: [refactor]
    paths: [.github/workflows/owner-values-cutover.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/owner-values-cutover.py
