name: temporary-dune-audit
on:
  push:
    branches: [refactor]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find all remaining ORM boundaries and stale references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ORM FILES ==='
          find app/Features -path '*/Api/Orm/*.php' -type f | sort
          echo '=== MODEL LEAF ==='
          grep -RnF 'PublicScheduleModelLeaf' app resources tests || true
          echo '=== ORM PORT ==='
          grep -RnF 'PublicScheduleOrmPort' app resources tests || true
          echo '=== PLACES PORT ==='
          grep -RnF 'PlaceLookup' app resources tests || true
          echo '=== OLD DISCOVERY SERVICE ==='
          grep -RnF 'Discovery\Services\PublicScheduleDiscoveryService' app resources tests || true
          echo '=== OLD DISCOVERY LEAF ==='
          grep -RnF 'Discovery\Support\PublicScheduleLeaf' app resources tests || true
          echo '=== EVENT PAGE API ==='
          grep -RnF 'Api\Orm\EventSchedulePageData' app resources tests || true
          echo '=== OLD PUBLIC READS ==='
          grep -RnF 'PublicScheduleEventReads' app resources tests || true
          echo '=== OLD EVENT ORM ==='
          grep -RnF 'EventOrmPort' app resources tests || true
