name: Platform UI presenter owner cutover
on:
  push:
    branches: [refactor]
    paths: [.github/workflows/platform-ui-presenters-cutover.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 41
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare sibling Commerce dependencies
        run: git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pgsql, gd
          coverage: none
          tools: composer:v2
      - name: Install application dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          touch database/database.sqlite
          composer install --no-interaction --no-progress --prefer-dist
      - name: Capture public route, command and view baselines
        run: |
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.before
          php artisan route:list --json > /tmp/routes.before
          php artisan view:cache
          php artisan view:clear
      - name: Directly relocate platform UI presentation adapters
        run: python3 scripts/platform-ui-presenters-cutover.py
      - name: Verify Blade component alias, commands and routes
        run: |
          composer dump-autoload --no-scripts --optimize
          php artisan optimize:clear
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.after
          php artisan route:list --json > /tmp/routes.after
          diff -u /tmp/commands.before /tmp/commands.after
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/routes.before')) == json.load(open('/tmp/routes.after'))
          print("Public routes unchanged")
          PY
          php artisan tinker --execute="if ((app('blade.compiler')->getClassComponentAliases()['event-json-ld'] ?? null) !== \\App\\Platform\\Ui\\Components\\EventJsonLd::class) { throw new \\RuntimeException('Blade event JSON-LD tag lost'); }"
          php artisan view:cache
          php artisan view:clear
      - name: Architecture, PHPStan, Pint and Rector
        run: |
          git add -A
          vendor/bin/pint --dirty
          git add -A
          git diff --cached --check
          composer architecture:test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          vendor/bin/rector process --dry-run
      - name: Verify public page, schedule and submission UI
        run: |
          vendor/bin/pest --compact tests/Feature/PublicPagesTest.php tests/Feature/PublicScheduleDiscoveryTest.php tests/Feature/SubmitEventReviewPreviewTest.php
      - name: PHP syntax and remove temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          while read -r f; do php -l "$f" >/dev/null; done < <(git diff --cached --name-only --diff-filter=ACMR | grep -E '^app/.*\.php$')
          test ! -f app/View/Components/EventJsonLd.php
          test ! -f app/Support/Events/EventCategoryPresenter.php
          test ! -f app/Support/Events/SubmitterContactPresenter.php
          test ! -f app/Support/Spaces/SpaceLocationPresenter.php
          test ! -f app/Support/Submission/ContributionSubjectPresenter.php
          rm -f scripts/platform-ui-presenters-cutover.py .github/workflows/platform-ui-presenters-cutover.yml
          git add -A
          git diff --cached --check
          git config user.name "ilmu360-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: move event and directory presentation adapters to Platform UI"
          git push origin HEAD:refactor
