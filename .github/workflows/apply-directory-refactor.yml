name: Apply ilmu360 Directory Ownership Refactor
on:
  push:
    branches: [refactor]
    paths:
      - '.github/workflows/apply-directory-refactor.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
      - name: Set up PHP for lint
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Execute and verify the refactor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /mnt/data
          ln -s "$GITHUB_WORKSPACE" /mnt/data/ilmu360-work
          for i in $(seq -w 1 6); do
            test -s ".github/refactor-scripts-part-$i.b64"
          done
          cat .github/refactor-scripts-part-{01..06}.b64 | base64 -d > /tmp/ilmu360-scripts.tar.xz
          echo '24897d81e31c2fff6467b9d74726cdba59e2535c5dd68a70123433b2030fa140  /tmp/ilmu360-scripts.tar.xz' | sha256sum -c -
          mkdir -p /tmp/ilmu360-scripts
          tar -xJf /tmp/ilmu360-scripts.tar.xz -C /tmp/ilmu360-scripts
          for i in $(seq 1 16); do
            f=$(find /tmp/ilmu360-scripts -maxdepth 1 -type f -name "phase${i}_*.py" -print -quit)
            test -n "$f"
            echo "::group::Applying $f"
            python3 "$f"
            echo "::endgroup::"
          done
          test ! -e app/Features/Directory
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('app/Features')
          names = ['Institutions','Persons','References','Places','DonationChannels']
          owners = {}
          for name in names:
              f = root/name/'feature.json'
              assert f.exists(), name
              obj = json.loads(f.read_text())
              assert obj['schema'] == 2 and obj['name'] == name
              assert (root/name/'FeatureServiceProvider.php').exists()
              for key, writers in obj['owns'].items():
                  assert key not in owners, (key, name, owners.get(key))
                  owners[key] = name
                  for writer in writers:
                      path = Path('app')/writer.removeprefix('App\\').replace('\\','/')
                      assert path.exists(), (key, writer, path)
          assert len([p for p in root.iterdir() if p.is_dir()]) == 26
          print('Verified five owner manifests, unique resource ownership, and 26 features')
          PY
          rm .github/refactor-scripts-part-{01..06}.b64
          rm .github/workflows/refactor-source-export.yml .github/workflows/apply-directory-refactor.yml
          git add -A
          git diff --cached --check
          while IFS= read -r file; do
            php -l "$file" >/dev/null || exit 1
          done < <(git diff --cached --name-only --diff-filter=ACMR -- '*.php')
          echo 'PHP lint passed for changed PHP files'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: split Directory into five domain-owned features'
          git push origin HEAD:refactor
