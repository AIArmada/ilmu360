name: One-time root platform consolidation
on:
  push:
    branches: [refactor]
    paths: ['.github/workflows/root-platform-cutover.yml']
permissions:
  contents: write
concurrency:
  group: root-platform-cutover-refactor
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Obtain sibling Commerce sources
        run: |
          git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
          test -f ../commerce/packages/commerce-support/composer.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pgsql, gd
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          touch database/database.sqlite
          composer install --no-interaction --no-progress --prefer-dist
      - name: Capture existing routing and command discovery
        run: |
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.before
          php artisan route:list --json > /tmp/routes.before.json
      - name: Move generic root infrastructure without compatibility wrappers
        run: python3 scripts/root-platform-cutover.py
      - name: Rebuild autoload
        run: composer dump-autoload --no-scripts --optimize
      - name: Verify command and route parity
        run: |
          php artisan optimize:clear
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.after
          php artisan route:list --json > /tmp/routes.after.json
          diff -u /tmp/commands.before /tmp/commands.after
          python3 - <<'PY'
          import json
          a = json.load(open('/tmp/routes.before.json'))
          b = json.load(open('/tmp/routes.after.json'))
          assert a == b, 'HTTP route metadata changed unexpectedly'
          print('Routes preserved:', len(a))
          PY
      - name: Format and verify architecture
        run: |
          git add -A
          vendor/bin/pint --dirty
          git add -A
          git diff --cached --check
          composer architecture:test
      - name: Check moved PHP syntax
        run: |
          git diff --cached --name-only --diff-filter=ACMR | grep -E '^app/.*\.php$|^bootstrap/.*\.php$' | while read -r file; do
            php -l "$file" >/dev/null || exit 1
          done
      - name: Remove one-time migration scaffolding and commit
        run: |
          rm -f scripts/root-platform-cutover.py .github/workflows/root-platform-cutover.yml
          git add -A
          git diff --cached --check
          git config user.name "ilmu360-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: consolidate generic root support into Platform without aliases"
          git push origin HEAD:refactor
