name: Dune temporary source snapshot
on:
  push:
    branches: [refactor]
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package source for conversion audit
        shell: bash
        run: |
          paths=()
          for path in app tests tools config database resources bootstrap routes .agents .ai .github composer.json composer.lock phpstan.neon phpstan-baseline.neon package.json; do
            if [ -e "$path" ]; then paths+=("$path"); fi
          done
          tar -czf /tmp/ilmu360-current-source.tar.gz "${paths[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: dune-current-source
          path: /tmp/ilmu360-current-source.tar.gz
          if-no-files-found: error
