name: One-time Events insights feature ownership
on:
  push:
    branches: [refactor]
    paths: ['.github/workflows/events-insights-cutover.yml']
permissions:
  contents: write
concurrency:
  group: events-insights-cutover-refactor
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Obtain Commerce dependency
        run: |
          git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
          test -f ../commerce/packages/commerce-support/composer.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pgsql, gd
          coverage: none
          tools: composer:v2
      - name: Install project dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          touch database/database.sqlite
          composer install --no-interaction --no-progress --prefer-dist
      - name: Record existing transport surfaces
        run: |
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.before
          php artisan route:list --json > /tmp/routes.before.json
      - name: Perform direct feature cutover
        run: python3 scripts/events-insights-cutover.py
      - name: Refresh optimized autoloading
        run: composer dump-autoload --no-scripts --optimize
      - name: Validate new interface binding and route parity
        run: |
          php artisan optimize:clear
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.after
          php artisan route:list --json > /tmp/routes.after.json
          diff -u /tmp/commands.before /tmp/commands.after
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/routes.before.json')) == json.load(open('/tmp/routes.after.json'))
          print('HTTP routes unchanged')
          PY
          php artisan tinker --execute="if (!(app(\\App\\Features\\Events\\Api\\ProductSignalsInsights::class) instanceof \\App\\Features\\Events\\Services\\ProductSignalsInsightsService)) { throw new \\RuntimeException('Feature interface not bound'); }"
      - name: Check style, boundaries and PHPStan
        run: |
          git add -A
          vendor/bin/pint --dirty
          git add -A
          git diff --cached --check
          composer architecture:test
      - name: Check changed PHP files
        run: |
          git diff --cached --name-only --diff-filter=ACMR | grep -E '^app/.*\.php$|^bootstrap/.*\.php$' | while read -r file; do
            php -l "$file" >/dev/null || exit 1
          done
      - name: Cleanup and commit without old service
        run: |
          rm -f scripts/events-insights-cutover.py .github/workflows/events-insights-cutover.yml
          git add -A
          git diff --cached --check
          git config user.name "ilmu360-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: move product signals reporting into Events behind public Api"
          git push origin HEAD:refactor
