name: One-time Events share-card job ownership
on:
  push:
    branches: [refactor]
    paths: ['.github/workflows/share-card-job-owner-cutover.yml']
permissions:
  contents: write
concurrency:
  group: events-share-card-job-cutover-refactor
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Obtain sibling Commerce sources
        run: |
          git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
          test -f ../commerce/packages/commerce-support/composer.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pgsql, gd
          coverage: none
          tools: composer:v2
      - name: Install media renderer runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pango1.0-tools fontconfig
          command -v pango-view
      - name: Install project dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          touch database/database.sqlite
          composer install --no-interaction --no-progress --prefer-dist
      - name: Snapshot transport registrations
        run: |
          php artisan route:list --json > /tmp/routes.before.json
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.before
      - name: Cut over Events share-card queue ownership
        run: python3 scripts/share-card-job-owner-cutover.py
      - name: Verify DI and registrations
        run: |
          composer dump-autoload --no-scripts --optimize
          php artisan optimize:clear
          php artisan route:list --json > /tmp/routes.after.json
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.after
          diff -u /tmp/commands.before /tmp/commands.after
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/routes.before.json'))==json.load(open('/tmp/routes.after.json'))
          print('Public routes preserved')
          PY
          php artisan tinker --execute="if (!(app(\\App\\Shared\\Events\\EventShareCardPrewarm::class) instanceof \\App\\Services\\ShareCards\\ShareCardService)) { throw new \\RuntimeException('EventShareCardPrewarm binding missing'); }"
          php artisan tinker --execute="if (!(app(\\App\\Features\\Events\\Api\\ShareCardWarmScheduler::class) instanceof \\App\\Features\\Events\\Actions\\ScheduleShareCardWarmAction)) { throw new \\RuntimeException('Scheduler public Api missing'); }"
      - name: Enforce formatting, feature boundaries and types
        run: |
          git add -A
          vendor/bin/pint --dirty
          git add -A
          git diff --cached --check
          composer architecture:test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Share-card job regression tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -name '*Test.php' | grep -Ei 'ShareCard|RenderShareCard' | LC_ALL=C sort | head -n 10 || true)
          echo "Running ${#tests[@]} share-card test files"
          if (( ${#tests[@]} > 0 )); then
            vendor/bin/pest --compact "${tests[@]}"
          fi
      - name: Check changed PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while read -r f; do php -l "$f" > /dev/null; done < <(git diff --cached --name-only --diff-filter=ACMR | grep -E '^app/.*\.php$')
      - name: Remove migration scaffolding and commit no-legacy code
        run: |
          rm -f scripts/share-card-job-owner-cutover.py .github/workflows/share-card-job-owner-cutover.yml
          git add -A
          git diff --cached --check
          git config user.name "ilmu360-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: move share-card queue into Events and keep renderer behind a contract"
          git push origin HEAD:refactor
