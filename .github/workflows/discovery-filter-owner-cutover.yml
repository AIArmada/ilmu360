name: Discovery filter ownership
on:
  push:
    branches: [refactor]
    paths: [.github/workflows/discovery-filter-owner-cutover.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Clone sibling commerce
        run: git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pgsql, gd
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          touch database/database.sqlite
          composer install --no-interaction --no-progress --prefer-dist
      - name: Capture command and route snapshot
        run: |
          php artisan route:list --json > /tmp/routes.before
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.before
      - name: Move Discovery filter implementations and provider registration
        run: python3 scripts/discovery-filter-owner-cutover.py
      - name: Ensure routes and service bindings
        run: |
          composer dump-autoload --no-scripts --optimize
          php artisan optimize:clear
          php artisan route:list --json > /tmp/routes.after
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.after
          diff -u /tmp/commands.before /tmp/commands.after
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/routes.before'))==json.load(open('/tmp/routes.after'))
          print('Routes unchanged')
          PY
          php artisan tinker --execute="if (!(app(\\App\\Shared\\Discovery\\SearchFilterNormalizer::class) instanceof \\App\\Features\\Discovery\\Services\\EventSearchFilterNormalizer)) { throw new \\RuntimeException('Discovery filter registration missing'); }"
          php artisan tinker --execute="if (!(app(\\App\\Shared\\Discovery\\SearchFilterRules::class) instanceof \\App\\Features\\Discovery\\Services\\EventSearchFilterRules)) { throw new \\RuntimeException('Discovery filter rules missing'); }"
      - name: Validate style, ownership and types
        run: |
          git add -A
          vendor/bin/pint --dirty
          git add -A
          git diff --cached --check
          composer architecture:test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          vendor/bin/rector process --dry-run
      - name: Discovery and SavedSearch regression tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -name '*Test.php' | grep -Ei 'Discovery|SearchFilter|SavedSearch' | LC_ALL=C sort | head -n 12 || true)
          echo "Selected ${#tests[@]} discovery tests"
          if (( ${#tests[@]} > 0 )); then vendor/bin/pest --compact "${tests[@]}"; fi
      - name: PHP syntax and no-legacy commit
        shell: bash
        run: |
          set -euo pipefail
          while read -r f; do php -l "$f" >/dev/null; done < <(git diff --cached --name-only --diff-filter=ACMR | grep -E '^app/.*\.php$')
          rm -f scripts/discovery-filter-owner-cutover.py .github/workflows/discovery-filter-owner-cutover.yml
          git add -A
          git diff --cached --check
          git config user.name "ilmu360-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: move Discovery filter services and wiring into owning feature"
          git push origin HEAD:refactor
