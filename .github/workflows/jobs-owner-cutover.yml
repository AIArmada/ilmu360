name: One-time Referral and ShareTracking job migration
on:
  push:
    branches: [refactor]
    paths: ['.github/workflows/jobs-owner-cutover.yml']
permissions:
  contents: write
concurrency:
  group: jobs-owner-cutover-refactor
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Obtain sibling Commerce sources
        run: |
          git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
          test -f ../commerce/packages/commerce-support/composer.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pgsql, gd
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          touch database/database.sqlite
          composer install --no-interaction --no-progress --prefer-dist
      - name: Snapshot transport registrations
        run: |
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.before
          php artisan route:list --json > /tmp/routes.before.json
      - name: Migrate direct job implementations and signals producer
        run: python3 scripts/jobs-owner-cutover.py
      - name: Regenerate autoload and compare registrations
        run: |
          composer dump-autoload --no-scripts --optimize
          php artisan optimize:clear
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.after
          php artisan route:list --json > /tmp/routes.after.json
          diff -u /tmp/commands.before /tmp/commands.after
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/routes.before.json')) == json.load(open('/tmp/routes.after.json'))
          print("Route definitions unchanged")
          PY
      - name: Verify architecture and PSR-4
        run: |
          git add -A
          vendor/bin/pint --dirty
          git add -A
          git diff --cached --check
          composer architecture:test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Targeted queue and referral regression tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(git grep -ilE 'QualifyReferralFromShareOutcomeJob|ProduceCommittedShareSignalJob|CommittedShareSignalProducer' -- tests/ | grep 'Test.php$' | head -n 8 || true)
          printf 'Impacted test files: %s\n' "${#tests[@]}"
          if (( ${#tests[@]} > 0 )); then
            vendor/bin/pest --compact "${tests[@]}"
          fi
      - name: Check PHP syntax
        run: |
          git diff --cached --name-only --diff-filter=ACMR | grep -E '^app/.*\.php$' | while read -r file; do
            php -l "$file" >/dev/null || exit 1
          done
      - name: Remove temporary migration scaffolding and commit
        run: |
          rm -f scripts/jobs-owner-cutover.py .github/workflows/jobs-owner-cutover.yml
          git add -A
          git diff --cached --check
          git config user.name "ilmu360-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: move referral and share-signal jobs into owning features"
          git push origin HEAD:refactor

# Public referral dispatch and feature-owned observer register all private jobs.
