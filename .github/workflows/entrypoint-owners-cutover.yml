name: One-time owner entrypoints
on:
  push:
    branches: [refactor]
    paths: [.github/workflows/entrypoint-owners-cutover.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/entrypoint-owners-cutover.py
