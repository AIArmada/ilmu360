name: Feature event and Platform CLI owner cutover
on:
  push:
    branches: [refactor]
    paths: [.github/workflows/entrypoint-owners-cutover.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare sibling commerce packages
        run: git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pgsql, gd
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          touch database/database.sqlite
          composer install --no-interaction --no-progress --prefer-dist
      - name: Capture baseline command and schedule event registrations
        run: |
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.before
          php artisan help app:share:activate-local-examples --no-ansi > /tmp/share-help.before
          php artisan route:list --json > /tmp/routes.before
          php artisan event:list --no-ansi > /tmp/events.before
          grep -q 'ReverseScheduleCancellationShareOutcome' /tmp/events.before
      - name: Move entrypoints directly to owning layers
        run: python3 scripts/entrypoint-owners-cutover.py
      - name: Ensure routes, command identity and event registration parity
        run: |
          composer dump-autoload --no-scripts --optimize
          php artisan optimize:clear
          php artisan list --raw | LC_ALL=C sort > /tmp/commands.after
          php artisan help app:share:activate-local-examples --no-ansi > /tmp/share-help.after
          php artisan route:list --json > /tmp/routes.after
          php artisan event:list --no-ansi > /tmp/events.after
          diff -u /tmp/commands.before /tmp/commands.after
          diff -u /tmp/share-help.before /tmp/share-help.after
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/routes.before'))==json.load(open('/tmp/routes.after'))
          before=open('/tmp/events.before').read()
          after=open('/tmp/events.after').read()
          old='App\\Listeners\\ShareTracking\\ReverseScheduleCancellationShareOutcome'
          new='App\\Features\\ShareTracking\\EntryPoints\\Listeners\\ReverseScheduleCancellationShareOutcome'
          assert before.count(old)>3,('expected duplicate old registrations',before.count(old))
          assert after.count(new)==3,('one registration per event required',after.count(new))
          assert old not in after
          print('Eliminated duplicated schedule reversal subscriptions:',before.count(old),'to',after.count(new))
          for event in ('EventCancelled','EventOccurrenceCancelled','EventSessionCancelled'):
              assert event in after,event
          print('Schedule reversal handlers preserved without duplicates')
          PY
          php artisan tinker --execute="if (!(app(\\App\\Platform\\Console\\Commands\\ActivateLocalShareExamples::class) instanceof \\Illuminate\\Console\\Command)) { throw new \\RuntimeException('Missing Platform Share demo CLI'); }"
      - name: Architecture, PHPStan, Pint, Rector
        run: |
          git add -A
          vendor/bin/pint --dirty
          git add -A
          git diff --cached --check
          composer architecture:test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          vendor/bin/rector process --dry-run
      - name: Local share activation and reversal regression
        run: |
          vendor/bin/pest --compact tests/Feature/ActivateLocalShareExamplesTest.php tests/Feature/ShareTracking/Wp2LifecycleTest.php
      - name: Lint, remove one-time scripts and commit
        shell: bash
        run: |
          set -euo pipefail
          while read -r f; do php -l "$f" >/dev/null; done < <(git diff --cached --name-only --diff-filter=ACMR | grep -E '^app/.*\.php$')
          test ! -f app/Console/Commands/ActivateLocalShareExamples.php
          test ! -f app/Listeners/ShareTracking/ReverseScheduleCancellationShareOutcome.php
          rm -f scripts/entrypoint-owners-cutover.py .github/workflows/entrypoint-owners-cutover.yml
          git add -A
          git diff --cached --check
          git config user.name "ilmu360-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: move Share demo CLI and reversal listener to owners"
          git push origin HEAD:refactor
